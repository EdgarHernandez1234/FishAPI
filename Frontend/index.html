<!DOCTYPE html>
<html lang="en">
<html color-mode="light"></html>

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Fisch - Find the best days to fish using weather conditions and fishing bite scores.">

    <title>Fisch | Fishing Forecast</title>

    <link rel="stylesheet" href="styles.css">

    <script src="script.js" defer></script>
</head>

<body>
    <form class="search-box" action="/search" method="GET">

        <div class="search-wrapper">

            <input
                type="text"
                name="q"
                id="city-search"
                placeholder="Input a city in California here"
                aria-label="Search California cities"
                autocomplete="address-level2"
                required
            >

            <button type="submit">
                Search
            </button>

        </div>

    </form>

    <header>

        <h1>Bite Score</h1>

    </header>

    <section
        id="Date-Blocks"
        aria-label="Seven day fishing forecast"
    >

        <div class="day" id="today">

            <h1 class="date">Oct 19</h1>

            <span class="score" id="eight">
                8
            </span>

        </div>

        <div class="day">

            <h1 class="date">Oct 20</h1>

            <span class="score" id="six">
                6
            </span>

        </div>

        <div class="day">

            <h1 class="date">Oct 21</h1>

            <span class="score" id="seven">
                7
            </span>

        </div>

        <div class="day">

            <h1 class="date">Oct 22</h1>

            <span class="score" id="five">
                5
            </span>

        </div>

        <div class="day">

            <h1 class="date">Oct 23</h1>

            <span class="score" id="nine">
                9
            </span>

        </div>

        <div class="day">

            <h1 class="date">Oct 24</h1>

            <span class="score" id="four">
                4
            </span>

        </div>

        <div class="day">

            <h1 class="date">Oct 25</h1>

            <span class="score" id="seven">
                7
            </span>

        </div>

    </section>

    <main id="Main-Blocks">

        <section
            id="Overall-Rating"
            aria-label="Overall fishing rating"
        >

            <div id="line">

                <h1>8/10</h1>

                <h1>Great day to fish</h1>

            </div>

        </section>

        <section
            id="Sub-Rating-Blocks"
            aria-label="Fishing weather conditions"
        >

            <div class="rating">

                <h1>Pressure</h1>

                <div class="bar">

                    <div
                        class="fill"
                        id="pressure"
                    ></div>

                </div>

            </div>

            <div class="rating">

                <h1>Temperature</h1>

                <div class="bar">

                    <div
                        class="fill"
                        id="temperature"
                    ></div>

                </div>

            </div>

            <div class="rating">

                <h1>Clouds</h1>

                <div class="bar">

                    <div
                        class="fill"
                        id="clouds"
                    ></div>

                </div>

            </div>

            <div class="rating">

                <h1>Rain</h1>

                <div class="bar">

                    <div
                        class="fill"
                        id="rain"
                    ></div>

                </div>

            </div>

            <div class="rating">

                <h1>Surf</h1>

                <div class="bar">

                    <div
                        class="fill"
                        id="surf"
                    ></div>

                </div>

            </div>


        </section>

    </main>

    <button id="theme-button" type="button" class="color-mode__btn light--hidden" aria-label="Toggle light mode">
        <svg id="sun-moon-icons" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z" />
        </svg>
    </button>

    <button id="theme-button" type="button" class="color-mode__btn dark--hidden" aria-label="Toggle dark mode">
        <svg id="sun-moon-icons" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z" />
        </svg>

    </button>

</body>

</html>
